services:
  media-wall:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fridge-homepage

    environment:
      - TZ=${TZ:-Europe/Berlin}

      # Where photos live inside the container (matches the volume
      # mount target below). Usually you don't need to change this.
      - PHOTOS_DIR=${PHOTOS_DIR:-/photos}

      # How many photo slides appear before a movie slide is shown.
      - MOVIE_EVERY=${MOVIE_EVERY:-5}

      # Which source(s) power the movie slide: "jellyfin", "seerr",
      # or "both" (interleaved). Leave as "both" if you've set up
      # both — Media Wall only uses the ones you've configured.
      - MOVIE_SOURCE=${MOVIE_SOURCE:-both}

      # --- Jellyfin (optional) ---------------------------------
      # Shows recently added movies from your own server.
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}

      # --- Jellyseerr / Overseerr (optional) -------------------
      # Shows recently requested + trending titles. Both projects
      # share the same API, so either works here unchanged.
      - SEERR_URL=${SEERR_URL:-}
      - SEERR_API_KEY=${SEERR_API_KEY:-}

      # --- Portainer container health (optional) ---------------
      # Generate an API key in Portainer under
      # User settings > Access tokens. ENDPOINT_ID is the
      # environment/endpoint ID shown in Portainer's URL when you
      # click into an environment (usually 1 for a single-node
      # setup).
      - PORTAINER_URL=${PORTAINER_URL:-}
      - PORTAINER_API_KEY=${PORTAINER_API_KEY:-}
      - PORTAINER_ENDPOINT_ID=${PORTAINER_ENDPOINT_ID:-1}

      # --- cron-job.org job history (optional) ------------------
      # Generate an API key at https://console.cron-job.org under
      # Settings. Leave CRONJOB_JOB_ID blank to check the most
      # recent runs across every job in the account, or set it to
      # a specific job's ID to check only that job.
      - CRONJOB_API_KEY=${CRONJOB_API_KEY:-}
      - CRONJOB_JOB_ID=${CRONJOB_JOB_ID:-}
      - CRONJOB_LOOKBACK=${CRONJOB_LOOKBACK:-5}

      # --- Wifi points / router ping checks (optional) ----------
      # Comma separated list of name=host pairs.
      - WIFI_POINTS=${WIFI_POINTS:-}

    volumes:
      - ${PHOTOS_HOST_PATH}:${PHOTOS_DIR:-/photos}:ro

    ports:
      - "${MEDIA_WALL_PORT:-8088}:3000"

    restart: unless-stopped
